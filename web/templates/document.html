{{define "document.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mpn-doc-id" content="{{.DocID}}">
  <meta name="mpn-markdown-panel" content="{{if .HasMarkdownPane}}1{{else}}0{{end}}">
  <title>{{.Title}}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand small text-white-50 me-2 text-decoration-none" href="/">Multiplayer Notepad</a>
      <input type="text" class="form-control form-control-sm doc-title-input text-white bg-dark border-secondary" id="docTitle" value="{{.DocTitle}}" placeholder="Untitled" aria-label="Document title">
      <div class="ms-auto d-flex align-items-center gap-2">
        <span id="connStatus" class="badge bg-secondary" title="Connection">offline</span>
        <button type="button" class="btn btn-outline-light btn-sm" data-bs-toggle="offcanvas" data-bs-target="#historyPanel" aria-controls="historyPanel" title="History" aria-label="History">🕘</button>
        <button type="button" class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#settingsModal" title="Settings" aria-label="Settings">⚙️</button>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 d-flex flex-column">
    <div id="editorRow" class="row g-0 flex-grow-1 m-0">
      <div id="editorPane" class="col-12 col-lg-6 p-0 border-end">
        <div id="editor" class="cm-host"></div>
      </div>
      <div id="previewPane" class="col-12 col-lg-6 p-0 bg-white d-none">
        <div id="preview" class="markdown-preview p-3"></div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Document settings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="setTitle">Title</label>
            <input type="text" class="form-control" id="setTitle">
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="setMarkdown">
            <label class="form-check-label" for="setMarkdown">Show live Markdown side panel</label>
          </div>
          <div class="mb-2">
            <label class="form-label" for="setPassword">New password (leave empty to keep)</label>
            <input type="password" class="form-control" id="setPassword" autocomplete="new-password">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="setClearPassword">
            <label class="form-check-label" for="setClearPassword">Remove password protection</label>
          </div>
          <div id="settingsError" class="alert alert-danger mt-3 d-none" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="saveSettings">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="historyPanel" aria-labelledby="historyPanelLabel" style="width: 420px;">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title" id="historyPanelLabel">Document history</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-0 d-flex flex-column">
      <div class="px-3 py-2 border-bottom small text-muted">
        A snapshot is saved each time a collaborator disconnects.
      </div>
      <div id="historyList" class="list-group list-group-flush overflow-auto" style="max-height: 35vh;">
        <div class="text-muted small p-3" id="historyEmpty">Loading...</div>
      </div>
      <div class="border-top p-2 small text-muted d-flex justify-content-between align-items-center">
        <span id="historyViewing">Select a snapshot to view</span>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="historyRefresh" title="Refresh" aria-label="Refresh">🔄</button>
      </div>
      <pre id="historyView" class="flex-grow-1 m-0 p-3 bg-light border-top overflow-auto" style="white-space: pre-wrap; font-size: 0.85rem;"></pre>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script type="module" src="/static/js/editor.js"></script>
</body>
</html>
{{end}}
